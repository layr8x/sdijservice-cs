<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시대인재 상담 수집</title>
<style>
  :root {
    --paper:#f4f6f8; --surface:#fff; --line:#dde2e9; --ink:#16202b; --ink-2:#47566a; --ink-3:#75849a;
    --accent:#2f5d8c; --ok:#1c6340; --ok-bg:#e4f2ea; --warn:#8a5600; --warn-bg:#fbf1de;
    --crit:#a8261d; --crit-bg:#fbeae8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#11161d; --surface:#182029; --line:#2b3541; --ink:#e7ecf2; --ink-2:#a8b5c5;
      --ink-3:#7d8b9c; --accent:#7fa9d6; --ok:#6bc194; --ok-bg:#122b1f; --warn:#e0a94a;
      --warn-bg:#2f2410; --crit:#f08a80; --crit-bg:#341916; }
  }
  * { box-sizing:border-box }
  body {
    width: 340px; margin:0; padding:16px; background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; font-size:14px; line-height:1.6;
  }
  h1 { font-size:15px; margin:0 0 2px; font-weight:600 }
  .sub { font-size:12px; color:var(--ink-3); margin:0 0 14px }

  .state { border-radius:8px; padding:12px 14px; border:1px solid var(--line); background:var(--surface); margin-bottom:12px }
  .state .badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:3px; display:inline-block; margin-bottom:6px }
  .b-ok { background:var(--ok-bg); color:var(--ok) }
  .b-warn { background:var(--warn-bg); color:var(--warn) }
  .b-crit { background:var(--crit-bg); color:var(--crit) }
  .state .msg { font-weight:500 }
  .state .when { font-size:12px; color:var(--ink-3); margin-top:4px }

  .rows { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); margin-bottom:12px }
  .r { display:flex; justify-content:space-between; gap:8px; padding:8px 12px; border-top:1px solid var(--line); font-size:13px }
  .r:first-child { border-top:none }
  .r .n { color:var(--ink-2) }
  .r .v { font-variant-numeric:tabular-nums; color:var(--ink) }
  .r .v.zero { color:var(--ink-3) }
  .r .v.err { color:var(--crit) }

  button {
    width:100%; padding:9px 12px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:14px; font-weight:500; cursor:pointer;
    font-family:inherit;
  }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff }
  button:disabled { opacity:.55; cursor:default }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  .btns { display:flex; flex-direction:column; gap:8px }

  details { margin-top:14px }
  summary { cursor:pointer; font-size:12.5px; color:var(--ink-3) }
  label { display:block; font-size:12px; color:var(--ink-2); margin:10px 0 4px }
  input {
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--ink); font-size:12.5px; font-family:ui-monospace,monospace;
  }
  input:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
  .hint { font-size:11.5px; color:var(--ink-3); margin-top:8px }
  .saved { font-size:12px; color:var(--ok); margin-top:8px; display:none }
</style>
</head>
<body>
  <h1>시대인재 상담 수집</h1>
  <p class="sub">파트너센터에 로그인되어 있으면 5분마다 자동으로 모읍니다.</p>

  <div class="state" id="state">
    <span class="badge b-warn" id="badge">확인 중</span>
    <div class="msg" id="msg">상태를 불러오는 중입니다</div>
    <div class="when" id="when"></div>
  </div>

  <div class="rows" id="rows" hidden></div>

  <div class="btns">
    <button class="primary" id="run">지금 수집</button>
    <button id="open">파트너센터 열기</button>
  </div>

  <details id="setup">
    <summary>연결 설정</summary>
    <label for="endpoint">수집 서버 주소</label>
    <input id="endpoint" placeholder="https://프로젝트.supabase.co/functions/v1/kakao-ingest">
    <label for="token">수집 키</label>
    <input id="token" type="password" placeholder="관리자에게 받은 키">
    <button id="save" style="margin-top:10px">저장</button>
    <div class="saved" id="saved">저장했습니다</div>
    <p class="hint">처음 한 번만 입력하면 됩니다. 값은 이 브라우저에만 저장됩니다.</p>
  </details>

  <script src="popup.js" type="module"></script>
</body>
</html>
